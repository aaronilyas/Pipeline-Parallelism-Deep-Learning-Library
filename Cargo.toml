[package]
name = "linalg"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Metal-accelerated dense linear algebra primitives for Apple Silicon"
license = "MIT"
publish = false

[dependencies]
half = "=2.7.1"
metal = "=0.33.0"

[dev-dependencies]
half = "=2.7.1"
# Links MetalPerformanceShaders for benchmark-only comparisons (raw `metal::objc::msg_send!`).
metal = { version = "=0.33.0", features = ["mps"] }
proptest = "=1.12.0"
rand = "=0.10.3"
rand_chacha = "=0.10.0"
rayon = "=1.12.0"

[workspace]
members = [".", "crates/core", "crates/cpu", "crates/metal", "crates/cuda", "crates/transport", "crates/schedule", "crates/pipeline", "crates/audit", "crates/bench"]
default-members = ["crates/core", "crates/cpu", "crates/metal", "crates/cuda", "crates/transport", "crates/schedule", "crates/pipeline", "crates/audit", "crates/bench"]
resolver = "2"
