[package]
name = "linalg-cuda"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
publish = false

[features]
cuda = ["dep:cudarc"]
debug-counters = []

[dependencies]
linalg-core = { path = "../core" }
cudarc = { version = "=0.18.2", optional = true, default-features = false, features = ["std", "driver", "cublas", "nvrtc", "dynamic-loading", "cuda-12060"] }
